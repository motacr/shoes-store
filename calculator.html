<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة المصاريف والدخل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-gold: #fbbf24;
      --green-income: #10b981;
      --red-expense: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.4rem;
      color: var(--accent-gold);
    }

    .result-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
      text-align: center;
    }

    .result-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .result-amount {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .badge-surplus {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--green-income);
    }

    .badge-deficit {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--red-expense);
    }

    .badge-zero {
      background-color: rgba(148, 163, 184, 0.2);
      color: var(--text-muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-box {
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .stat-box label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    .stat-box .val {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .calc-form {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
    }

    .btn-calc {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background-color: var(--accent-gold);
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-calc:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fa-solid fa-calculator"></i> حاسبة المصاريف والدخل</h1>
  </div>

  <div class="result-card">
    <div class="result-title">النتيجة النهائية (الزيادة / النقص)</div>
    <div id="net-result" class="result-amount" style="color: var(--text-main);">$0.00</div>
    <span id="status-badge" class="status-badge badge-zero">متوازن</span>
  </div>

  <div class="grid-2">
    <div class="stat-box">
      <label><i class="fa-solid fa-arrow-down" style="color: var(--green-income);"></i> مجموع الدخل</label>
      <div id="income-sum" class="val" style="color: var(--green-income);">$0.00</div>
    </div>
    <div class="stat-box">
      <label><i class="fa-solid fa-arrow-up" style="color: var(--red-expense);"></i> مجموع المصاريف</label>
      <div id="expense-sum" class="val" style="color: var(--red-expense);">$0.00</div>
    </div>
  </div>

  <div class="calc-form">
    <h3 style="font-size: 1rem; margin-bottom: 15px; color: var(--accent-gold);">إدخال مبلغ جديد للحساب</h3>
    <form id="calc-form">
      <div class="form-group">
        <label>نوع المبلغ</label>
        <select id="type">
          <option value="income">دخل (وارد +)</option>
          <option value="expense">مصروف (صادر -)</option>
        </select>
      </div>

      <div class="form-group">
        <label>المبلغ ($)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
      </div>

      <button type="submit" class="btn-calc">احسب واضف</button>
    </form>
  </div>

  <script>
    let totalIncome = 0;
    let totalExpense = 0;

    const form = document.getElementById('calc-form');
    const incomeSumEl = document.getElementById('income-sum');
    const expenseSumEl = document.getElementById('expense-sum');
    const netResultEl = document.getElementById('net-result');
    const statusBadgeEl = document.getElementById('status-badge');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const type = document.getElementById('type').value;
      const amount = parseFloat(document.getElementById('amount').value) || 0;

      if (type === 'income') {
        totalIncome += amount;
      } else {
        totalExpense += amount;
      }

      updateCalculatorUI();
      form.reset();
    });

    function updateCalculatorUI() {
      incomeSumEl.textContent = `$${totalIncome.toFixed(2)}`;
      expenseSumEl.textContent = `$${totalExpense.toFixed(2)}`;

      const diff = totalIncome - totalExpense;

      if (diff > 0) {
        netResultEl.textContent = `+$${diff.toFixed(2)}`;
        netResultEl.style.color = 'var(--green-income)';
        statusBadgeEl.textContent = 'زيادة (فائض)';
        statusBadgeEl.className = 'status-badge badge-surplus';
      } else if (diff < 0) {
        netResultEl.textContent = `-$${Math.abs(diff).toFixed(2)}`;
        netResultEl.style.color = 'var(--red-expense)';
        statusBadgeEl.textContent = 'نقص (عجز)';
        statusBadgeEl.className = 'status-badge badge-deficit';
      } else {
        netResultEl.textContent = `$0.00`;
        netResultEl.style.color = 'var(--text-main)';
        statusBadgeEl.textContent = 'متوازن';
        statusBadgeEl.className = 'status-badge badge-zero';
      }
    }
  </script>
</body>
</html>
