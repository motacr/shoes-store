<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مُدير الميزانية والمشتريات</title>

  <!-- ربط ملف التثبيت المباشر -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="الميزانية">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2344/2344132.png">
  <link rel="icon" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/2344/2344132.png">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-gold: #fbbf24;
      --green-income: #10b981;
      --red-expense: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 15px 15px 80px 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.3rem;
      color: var(--accent-gold);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid var(--border-color);
      z-index: 1000;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-btn.active {
      color: var(--accent-gold);
    }

    .nav-btn span {
      font-size: 1.2rem;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-gold);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: var(--accent-gold);
      color: #000;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .item-list {
      list-style: none;
      margin-top: 10px;
    }

    .item-card {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info div {
      font-weight: bold;
    }

    .item-info span {
      font-size: 0.85rem;
      color: var(--green-income);
    }

    .item-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      margin-right: 8px;
    }

    .stat-box {
      text-align: center;
      margin-bottom: 12px;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
    }

    .badge-ok { background-color: rgba(16, 185, 129, 0.2); color: var(--green-income); }
    .badge-bad { background-color: rgba(239, 68, 68, 0.2); color: var(--red-expense); }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="page-title">🛒 قائمة المشتريات</h1>
  </div>

  <!-- الصفحة الأولى: المشتريات -->
  <div id="page-items" class="page active">
    <div class="card">
      <h3 style="margin-bottom:12px; color: var(--accent-gold); font-size: 1rem;" id="form-title">إضافة عنصر جديد</h3>
      <form id="item-form">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label>اسم العنصر / السلعة</label>
          <input type="text" id="item-name" placeholder="مثال: حذاء رياضي" required>
        </div>
        <div class="form-group">
          <label>السعر (بالشيكل ₪)</label>
          <input type="number" id="item-price" step="0.5" placeholder="0.00" required>
        </div>
        <button type="submit" class="btn" id="btn-submit">إضافة للقائمة</button>
      </form>
    </div>

    <div class="card">
      <h3 style="font-size: 0.95rem; color: var(--text-muted);">الأشياء التي سيتم شراؤها:</h3>
      <ul id="items-container" class="item-list"></ul>
    </div>
  </div>

  <!-- الصفحة الثانية: الإحصائيات والراتب -->
  <div id="page-stats" class="page">
    <div class="card">
      <div class="form-group">
        <label>المرتب / الدخل الشهري (₪)</label>
        <input type="number" id="monthly-salary" placeholder="أدخل راتبك هنا" step="10">
      </div>
    </div>

    <div class="card stat-box">
      <div class="stat-title">الرصيد المتبقي / الفائض أو العجز</div>
      <div id="net-balance" class="stat-val">0.00 ₪</div>
      <span id="status-badge" class="status-badge badge-ok">الرصيد متوازن</span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div class="card stat-box">
        <div class="stat-title">إجمالي المرتب</div>
        <div id="stat-salary" class="stat-val" style="color: var(--accent-gold); font-size: 1.3rem;">0 ₪</div>
      </div>
      <div class="card stat-box">
        <div class="stat-title">مجموع المشتريات</div>
        <div id="stat-expenses" class="stat-val" style="color: var(--red-expense); font-size: 1.3rem;">0 ₪</div>
      </div>
    </div>
  </div>

  <!-- الشريط السفلي للتنقل -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('items', '🛒 قائمة المشتريات', this)">
      <span>🛒</span>
      المشتريات
    </button>
    <button class="nav-btn" onclick="switchPage('stats', '📊 الإحصائيات والميزانية', this)">
      <span>📊</span>
      الإحصائيات
    </button>
  </div>

  <script>
    // جلب البيانات المخزنة مسبقاً من ذاكرة الهاتف
    let items = JSON.parse(localStorage.getItem('budget_items')) || [];
    let salary = parseFloat(localStorage.getItem('budget_salary')) || 0;

    const itemForm = document.getElementById('item-form');
    const itemNameInput = document.getElementById('item-name');
    const itemPriceInput = document.getElementById('item-price');
    const editIdInput = document.getElementById('edit-id');
    const btnSubmit = document.getElementById('btn-submit');
    const formTitle = document.getElementById('form-title');
    const itemsContainer = document.getElementById('items-container');
    const salaryInput = document.getElementById('monthly-salary');

    // تعبئة خانة الراتب بالقيم المسبقة عند فتح التطبيق
    if (salary > 0) {
      salaryInput.value = salary;
    }

    // حفظ البيانات في ذاكرة الجوال
    function saveData() {
      localStorage.setItem('budget_items', JSON.stringify(items));
      localStorage.setItem('budget_salary', salary);
    }

    function switchPage(pageId, title, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(`page-${pageId}`).classList.add('active');
      document.getElementById('page-title').textContent = title;
      
      btn.classList.add('active');
      updateStats();
    }

    itemForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = itemNameInput.value.trim();
      const price = parseFloat(itemPriceInput.value) || 0;
      const editId = editIdInput.value;

      if (editId) {
        const index = items.findIndex(i => i.id == editId);
        if (index !== -1) {
          items[index].name = name;
          items[index].price = price;
        }
        btnSubmit.textContent = 'إضافة للقائمة';
        formTitle.textContent = 'إضافة عنصر جديد';
        editIdInput.value = '';
      } else {
        items.push({ id: Date.now(), name, price });
      }

      itemForm.reset();
      saveData();
      renderItems();
      updateStats();
    });

    function renderItems() {
      itemsContainer.innerHTML = '';
      if (items.length === 0) {
        itemsContainer.innerHTML = '<li style="text-align:center; color: var(--text-muted); padding:10px;">لا يوجد عناصر مضافة بعد</li>';
        return;
      }

      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'item-card';
        li.innerHTML = `
          <div class="item-info">
            <div>${item.name}</div>
            <span>${item.price.toFixed(2)} ₪</span>
          </div>
          <div class="item-actions">
            <button onclick="editItem(${item.id})">✏️</button>
            <button onclick="deleteItem(${item.id})">🗑️</button>
          </div>
        `;
        itemsContainer.appendChild(li);
      });
    }

    function deleteItem(id) {
      items = items.filter(item => item.id !== id);
      saveData();
      renderItems();
      updateStats();
    }

    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        itemNameInput.value = item.name;
        itemPriceInput.value = item.price;
        editIdInput.value = item.id;
        btnSubmit.textContent = 'حفظ التعديل';
        formTitle.textContent = 'تعديل العنصر';
      }
    }

    salaryInput.addEventListener('input', function() {
      salary = parseFloat(salaryInput.value) || 0;
      saveData();
      updateStats();
    });

    function updateStats() {
      const totalExpenses = items.reduce((sum, item) => sum + item.price, 0);
      const net = salary - totalExpenses;

      document.getElementById('stat-salary').textContent = `${salary.toFixed(2)} ₪`;
      document.getElementById('stat-expenses').textContent = `${totalExpenses.toFixed(2)} ₪`;

      const netEl = document.getElementById('net-balance');
      const badgeEl = document.getElementById('status-badge');

      if (net > 0) {
        netEl.textContent = `+${net.toFixed(2)} ₪`;
        netEl.style.color = 'var(--green-income)';
        badgeEl.textContent = `متبقي رصيد لديك`;
        badgeEl.className = 'status-badge badge-ok';
      } else if (net < 0) {
        netEl.textContent = `${net.toFixed(2)} ₪`;
        netEl.style.color = 'var(--red-expense)';
        badgeEl.textContent = `الرصيد بالسالب (عجز بـ ${Math.abs(net).toFixed(2)} ₪)`;
        badgeEl.className = 'status-badge badge-bad';
      } else {
        netEl.textContent = `0.00 ₪`;
        netEl.style.color = 'var(--text-main)';
        badgeEl.textContent = 'الرصيد متوازن';
        badgeEl.className = 'status-badge badge-ok';
      }
    }

    // تشغيل القراءة الأولى للبيانات المخزنة
    renderItems();
    updateStats();
  </script>
</body>
  </html>
